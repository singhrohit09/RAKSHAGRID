version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakshagrid-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=http://localhost:5000
      - DATABASE_URL=postgresql://raksha_admin:raksha_secure_pass@db:5432/rakshagrid
      - DATABASE_SSL=false
      - JWT_SECRET=change_me_to_a_cryptographically_secure_random_key_64_chars_min
      - INITIAL_ADMIN_PASSWORD=AdminSecurePassword_2026!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/server/data

  db:
    image: postgres:16-alpine
    container_name: rakshagrid-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=rakshagrid
      - POSTGRES_USER=raksha_admin
      - POSTGRES_PASSWORD=raksha_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha_admin -d rakshagrid"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  app_data:
